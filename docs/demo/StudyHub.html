.qz-clock.qz-urgent { color: var(--warn); }

.qz-options:disabled .qz-option { cursor: default; }
.qz-choice-tag { display: block; margin-top: .35rem; font-size: .8rem; font-weight: 700; }
.qz-actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.qz-actions [aria-pressed="true"] { border-color: var(--warn); }
.qz-feedback { margin: 1.2rem 0; padding: 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.qz-good-text { color: var(--good) !important; }
.qz-bad-text { color: var(--bad) !important; }
.qz-analysis-list, .qz-detail-list { padding-left: 1.3rem; }
.qz-analysis-list li, .qz-detail-list li { margin: .55rem 0; }
.qz-source { border-top: 1px solid var(--line); padding-top: .8rem; margin-top: 1rem !important; }
.qz-navigation { display: grid; grid-template-columns: 1fr auto 1fr; gap: .65rem; align-items: center; margin-top: 1.2rem; }

.qz-navigation .qz-button:last-child { justify-self: end; }
.qz-navigation-position { color: var(--muted); font-size: .9rem; }
.qz-expired, .qz-error { color: var(--warn); padding: .8rem; border: 1px solid var(--warn); border-radius: 9px; }

  .qz-module, .qz-question, .qz-feedback, .qz-option, .qz-scenario { background: white; color: black; box-shadow: none; }
  .qz-option, .qz-feedback h4, .qz-stem { break-inside: avoid; }
}

<script type="application/json" id="hub-content">{"schema":1,"moduleId":"study-studio-ai-agents-tool-use","courseTitle":"AI Agents: Tool Use in Practice","courseSubtitle":"MICROSOFT AI AGENTS FOR BEGINNERS · OPEN COURSE SAMPLE","contentVersion":"2026-11-02.2","storageKey":"study-studio.ai-agents-tool-use.v1","downloadPrefix":"AgentToolUse","timeZone":"UTC","chapters":[{"id":"4","number":4,"title":"Tool Use Design Pattern","root":{"id":"T-root","label":"Agent tool use","summary":"Describe a capability, select a function, execute it and return its result.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 27–333","pages":[],"children":[{"id":"T-K01","label":"Executable capabilities","summary":"Tools are functions or API calls invoked in response to model-generated calls.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 27–29","pages":[],"children":[],"details":"A tool is code that an agent can use to perform an action. The source gives a calculator function and third-party API calls for stock prices or weather as examples. These capabilities allow an agent to interact with systems beyond the language model itself.\n\nThe model-generated function call requests that code be run. Keep the request to use a tool distinct from the actual execution of the tool: describing or selecting a capability does not itself produce its result.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L27-L29"}},{"id":"T-K02","label":"Choose the use case","summary":"Information retrieval, code, workflows, support and content tasks.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 31–39","pages":[],"children":[],"details":"The source groups tool use around tasks that involve external systems. An agent can retrieve current data from APIs or databases, execute calculations or simulations, and connect operations in a multi-step workflow.\n\nOther uses include querying customer-support systems and applying tools that check, summarise or evaluate content. The common connection is the need for a capability that can act on data or a system while the agent works towards the user's task.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L31-L39"}},{"id":"T-K03","label":"Six building blocks","summary":"The implementation combines distinct responsibilities.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 41–55","pages":[],"children":[{"id":"T-schema-exec","label":"Describe + invoke","summary":"Schemas describe tools; execution logic governs invocation.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 45–47","pages":[],"children":[],"details":"A function or tool schema describes a capability by its name, purpose, required parameters and expected output. This description gives the model the information it needs to construct a request for an available tool.\n\nExecution logic governs how and when the tool is invoked in response to the user's intent and the conversation context. The source mentions planners, routing and conditional flows as possible parts of that logic. The schema describes the capability; the execution logic controls its invocation.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L45-L47"}},{"id":"T-message-integrate","label":"Connect","summary":"Message handling manages flow; integration connects the tools.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 49–51","pages":[],"children":[],"details":"The message handling system manages the conversational flow between user inputs, model responses, tool calls and tool outputs. It connects the information exchanged during the tool-use process.\n\nThe integration framework connects the agent to the tools themselves, whether they are simple functions or external services. These responsibilities are related: one manages the exchange of messages, while the other supplies the connection to the capabilities used in that exchange.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L49-L51"}},{"id":"T-validation-state","label":"Validate + retain","summary":"Handle failures and parameters; preserve context and earlier interactions.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 53–55","pages":[],"children":[],"details":"Error handling and validation deal with failed tool execution, invalid parameters and unexpected responses. Their purpose in the pattern is to handle problems arising when a requested capability is used.\n\nState management tracks the conversation context, previous tool interactions and persistent data. It supports consistency across multiple turns by retaining information from earlier interactions. Handling an individual failure and retaining context are separate responsibilities in the source's implementation model.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L53-L55"}}],"details":"The source identifies six building blocks with distinct responsibilities. Schemas describe the available functions; execution logic governs invocation; message handling manages the flow of requests and results; and an integration framework connects the actual tools.\n\nError handling and validation address failures, parameters and unexpected responses. State management retains conversation context, earlier tool interactions and persistent data across turns. Together, these components connect the model's choice of tool with execution and the continuing conversation.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L41-L55"}},{"id":"T-K04","label":"Tool contract","summary":"Name, purpose, required parameters and expected output; the time example requires location.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 45–108","pages":[],"children":[],"details":"A tool schema describes the function name, its purpose, its parameters and the expected output. In the source's time-lookup example, the function is named get_current_time and accepts a required location parameter of type string.\n\nThe schema is sent to the model together with the user's request. It enables the model to select the function and supply arguments, but does not implement the lookup. The developer also needs a model that supports function calling and the executable code for every function that is exposed.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L45-L108"}},{"id":"T-K05","label":"Function-call loop","summary":"A tool call is not the final user answer.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 61–192","pages":[],"children":[{"id":"T-call","label":"Select","summary":"The model returns the selected function name and arguments.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 61–87","pages":[],"children":[],"details":"The model receives descriptions of the available functions alongside the user's request. It uses those descriptions to choose an appropriate function and returns that function's name and the arguments to pass to it.\n\nIn the time-lookup example, the returned item is a tool call. The application still has to execute the selected function before the user can receive an answer based on its result.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L61-L87"}},{"id":"T-execute","label":"Execute","summary":"The application invokes the function’s code.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 138–173","pages":[],"children":[],"details":"After the model chooses a function, the application must run the code that carries out the requested task. The source's time-lookup example extracts the function name and parses its arguments from the model response.\n\nWhen the selected name is get_current_time, the application passes the supplied location into that function. This is the execution step that produces a result; it follows the model's selection of a function and precedes returning the result to the model.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L138-L173"}},{"id":"T-return","label":"Return","summary":"Send the result with its matching call_id, then obtain the answer.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 175–192","pages":[],"children":[],"details":"The source appends the tool result as a function_call_output message. Its call_id matches the earlier function call, and its output field contains the returned time value.\n\nThe application then sends the updated messages back to the model. The model uses the tool result to produce the response returned to the user. Keeping the result associated with its call connects the execution step to the next model response.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L175-L192"}}],"details":"The function-call sequence begins when the application sends the user's request and the available function descriptions to the model. The model compares the request with those descriptions and returns a chosen function name and arguments.\n\nThe application executes the corresponding function and returns its output to the model. In the source example, a call_id ties the output to the function call. A further model response uses that result to answer the user. A tool call is therefore an intermediate request for execution, not the final answer.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L61-L192"}},{"id":"T-K06","label":"Local + remote tools","summary":"Frameworks can expose local functions and tools from an MCP server.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 208–245","pages":[],"children":[{"id":"T-local","label":"Local function","summary":"A decorated function can be serialised to a schema.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 208–216","pages":[],"children":[],"details":"In the framework example, a Python function becomes a tool through the @tool decorator. The framework serialises the function and its parameters into a schema that can be sent to the model.\n\nThe framework also handles the back-and-forth communication between the model and the function code. The decorated function remains the implementation of the capability, while the generated schema describes how the model can request it.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L208-L216"}},{"id":"T-mcp","label":"MCP server","summary":"Publishes tools and schemas; remote queries go to the server.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 241–245","pages":[],"children":[],"details":"A server using the Model Context Protocol publishes its tools together with their schemas. The source explains that the framework reads those schemas and makes the remote tools available to the model alongside local functions.\n\nThe source uses an HTTP connection to a remote search server as its example. Queries written by the model are sent to that server when its tool is used. The server supplies the remote capabilities and their descriptions; the model still selects a tool for the task.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L241-L245"}}],"details":"The source describes both tools implemented as local Python functions and tools published by an MCP server. A framework can convert decorated local functions into schemas and manage the exchange between the model and the tool code.\n\nAn MCP server publishes tools together with their schemas. The framework can load those descriptions and offer remote tools alongside local ones. When a remote tool is used, the generated query is sent to that server; the location of execution is a relevant distinction between the two routes.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L208-L245"}},{"id":"T-K07","label":"Managed service","summary":"The source groups knowledge and action tools; toolsets group capabilities and threads retain messages.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 268–291","pages":[],"children":[],"details":"The managed-service example handles tool calls and responses on the server and keeps conversation information in threads. It groups capabilities into knowledge tools, such as search and file retrieval, and action tools, such as function calling and code interpretation.\n\nA toolset allows several tools to be used together. A thread records the message history of a particular conversation. The distinction is between organising the available capabilities and retaining the conversation in which those capabilities are used.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L268-L291"}},{"id":"T-K08","label":"Read-only boundary","summary":"Restrict generated-SQL database access and use a secure environment.","section":"Microsoft AI Agents for Beginners, Tool Use, lines 329–333","pages":[],"children":[],"details":"The source identifies injection and database tampering as risks when a model generates SQL. It recommends configuring the application's database access as read-only and names a read-only SELECT role for the database services discussed.\n\nIt also recommends a secure execution environment and describes extracting and transforming operational data into a read-only database or warehouse. The application's permissions should retain that reading boundary when the agent uses the data.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L329-L333"}}],"details":"The tool-use pattern gives an agent access to executable capabilities beyond producing a text response. A capability may be a local function or a call to an external service. The model compares the user's task with the available function descriptions and returns a selected function name and arguments.\n\nThe application executes that function and sends its result back to the model. Only then can the model use the returned information in its answer. The lesson connects this sequence to tool schemas, execution logic, message handling, integration, validation and state management, then considers local tools, remote tools and restricted database access.","source":{"title":"Microsoft AI Agents for Beginners — Tool Use Design Pattern","edition":"Revision f09e94ffe170f8af6d3db7c42987bbe4db227723","pdfPages":[],"url":"https://github.com/microsoft/ai-agents-for-beginners/blob/f09e94ffe170f8af6d3db7c42987bbe4db227723/04-tool-use/README.md#L27-L333"}},"cards":[{"id":"T-F01","section":"Microsoft AI Agents for Beginners, Tool Use, lines 27–29","topic":"Tool use","question":"What is a tool in this design pattern?","answer":"Executable code, such as a function or an external API call, that an agent can use to perform an action.","hint":"Think of a capability implemented in code.","explanation":"The model generates a function call; the corresponding code carries out the task.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F02","section":"Microsoft AI Agents for Beginners, Tool Use, lines 31–39","topic":"Use cases","question":"Name two use cases for the Tool Use Design Pattern.","answer":"Examples include dynamic information retrieval, code execution, workflow automation, customer support, and content generation or editing.","hint":"The source groups five kinds of task.","explanation":"Choose tools according to the task’s need to interact with external systems.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F03","section":"Microsoft AI Agents for Beginners, Tool Use, lines 41–55","topic":"Six building blocks","question":"What are the six implementation building blocks?","answer":"Schemas; execution logic; message handling; tool integration; error handling and validation; state management.","hint":"Describe, invoke, connect, validate, remember.","explanation":"Each addresses a different responsibility in the tool-use interaction.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F04","section":"Microsoft AI Agents for Beginners, Tool Use, lines 45–108","topic":"Schemas","question":"What should a function/tool schema describe?","answer":"The tool’s name, purpose, required parameters and expected outputs.","hint":"It is a description of an available capability.","explanation":"The source’s time-tool schema names get_current_time and requires a location string.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F05","section":"Microsoft AI Agents for Beginners, Tool Use, lines 63–67","topic":"Model capability","question":"What three things are needed to implement function calling?","answer":"A model that supports function calling, function descriptions in a schema, and the code for every described function.","hint":"Capability, contract, implementation.","explanation":"A schema alone cannot perform the function’s work.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F06","section":"Microsoft AI Agents for Beginners, Tool Use, lines 61–87","topic":"Function call","question":"What does the model return when it selects a function?","answer":"The selected function’s name and arguments.","hint":"The call is an intermediate step.","explanation":"The application executes the function, returns the result, and obtains the model’s response.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F07","section":"Microsoft AI Agents for Beginners, Tool Use, lines 163–180","topic":"Call/result matching","question":"How does the source example connect a function result to its call?","answer":"The function_call_output includes the tool call’s call_id.","hint":"Retain the identifier.","explanation":"The output contains the executed function’s result and the matching call identifier.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F08","section":"Microsoft AI Agents for Beginners, Tool Use, lines 208–216","topic":"Framework tools","question":"How does the framework example turn a local function into a tool?","answer":"It uses a decorated Python function and serialises the function and its parameters into a schema.","hint":"The lesson illustrates an @tool decorator.","explanation":"The framework also handles the back-and-forth model–code exchange.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F09","section":"Microsoft AI Agents for Beginners, Tool Use, lines 241–245","topic":"MCP","question":"What does an MCP server publish for tool use?","answer":"Tools together with their schemas.","hint":"MCP means Model Context Protocol.","explanation":"A framework can read those schemas and offer the remote tools alongside local ones; generated remote queries go to that server.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F10","section":"Microsoft AI Agents for Beginners, Tool Use, lines 278–289","topic":"Tool categories","question":"Which categories of tools does the managed-service example identify?","answer":"Knowledge tools, such as search and file retrieval; and action tools, such as function calling and code interpretation.","hint":"Separate information access from the named action capabilities.","explanation":"These are the categories used in the source’s service example.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F11","section":"Microsoft AI Agents for Beginners, Tool Use, lines 291–291","topic":"Toolset and thread","question":"How do a toolset and a thread differ in the service example?","answer":"A toolset groups tools; a thread keeps the history of messages in a conversation.","hint":"Capabilities versus conversation history.","explanation":"Grouping tools does not itself provide the conversation record.","pitfall":"","pages":[],"kind":"Concept"},{"id":"T-F12","section":"Microsoft AI Agents for Beginners, Tool Use, lines 329–333","topic":"Read-only access","question":"What database-access configuration does the lesson recommend for generated SQL?","answer":"Restricted, read-only access; a read-only SELECT role for the named database services, with a secure environment.","hint":"Make the access permissions match a reading task.","explanation":"The recommendation addresses injection or tampering concerns by restricting what the application can do.","pitfall":"","pages":[],"kind":"Concept"}],"questions":[{"id":"T-Q01","number":1,"marks":1,"topic":"Tool definition","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 27–29","pages":[],"learning_objectives":["LO-T01"],"knowledge_points":["T-K01"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which option best describes a tool in the source’s design pattern?","statements":[],"options":{"A":"Only a sentence in the system prompt","B":"A final answer already written by the model","C":"Executable code such as a function or an API call","D":"A replacement for all conversation messages"},"answer":"C","explanation":"A tool is code that can be executed to perform actions, including simple functions and external API calls.","option_analysis":{"A":"A description can explain a tool, but it is not the executable capability.","B":"A final answer is distinct from the tool.","C":"This matches the source definition.","D":"The pattern still needs message handling."},"steps":["Identify the executable capability."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q02","number":2,"marks":1,"topic":"Function schema","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 84–108","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K04"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"In the source’s get_current_time schema, which input is required?","statements":[],"options":{"A":"call_id as a city name","B":"location as a string","C":"A completed final answer","D":"A database administrator password"},"answer":"B","explanation":"The source’s function schema defines location as a string and lists it as required.","option_analysis":{"A":"call_id matches calls and results; it is not the location parameter.","B":"This matches the schema.","C":"The answer is produced after the tool interaction.","D":"This is not a parameter of the illustrated tool."},"steps":["Read the parameters and required list."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q03","number":3,"marks":1,"topic":"Original scenario","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 61–173","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K05"],"format":"mcq","difficulty":"Application","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"An agent returns a function name and location arguments for a time lookup. What should the application do next?","statements":[],"options":{"A":"Display the function name as the current time","B":"Skip execution and invent the tool result","C":"Delete the conversation context","D":"Execute the selected function with those arguments"},"answer":"D","explanation":"Original scenario: the returned call requests execution. The function’s result must then be returned to the model.","option_analysis":{"A":"The function name is not the requested information.","B":"The source requires executing the function.","C":"The example preserves messages for the next turn.","D":"This is the next step in the source’s loop."},"steps":["Distinguish a tool call from a final answer.","Invoke the function."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q04","number":4,"marks":1,"topic":"Result matching","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 175–180","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K05"],"format":"mcq","difficulty":"Application","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which field links the function_call_output to its corresponding function call in the source example?","statements":[],"options":{"A":"call_id","B":"The slide number","C":"The course title","D":"The function description alone"},"answer":"A","explanation":"The returned function_call_output copies the tool call’s call_id.","option_analysis":{"A":"This is the matching identifier in the example.","B":"Slides are not part of the source call protocol.","C":"The course title is unrelated to matching.","D":"The description explains the tool; it does not identify this call."},"steps":["Inspect the returned output message."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q05","number":5,"marks":1,"topic":"Use cases","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 33–39","pages":[],"learning_objectives":["LO-T02"],"knowledge_points":["T-K02"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which source use case fits an agent coordinating a scheduler and an email service in a repetitive process?","statements":[],"options":{"A":"A standalone time lookup","B":"Workflow automation","C":"Function-schema naming alone","D":"Conversation history storage"},"answer":"B","explanation":"Original scenario: the source describes workflow automation as integrating tools such as schedulers, email services or data pipelines.","option_analysis":{"A":"This does not describe the coordinated process in the question.","B":"This matches the source use case.","C":"Naming alone does not carry out the process.","D":"Retaining messages is a separate responsibility."},"steps":["Identify the multi-step or repetitive process.","Match it to the source use case."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q06","number":6,"marks":1,"topic":"Validation","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 53–53","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K03"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which building block validates parameters and manages unexpected tool responses?","statements":[],"options":{"A":"Course navigation","B":"Tool naming alone","C":"Error handling and validation","D":"The lesson’s video thumbnail"},"answer":"C","explanation":"The source explicitly assigns failures, parameter validation and unexpected responses to this building block.","option_analysis":{"A":"Navigation is outside the listed runtime responsibilities.","B":"A name alone does not perform validation.","C":"This matches the source.","D":"The thumbnail is a learning resource, not runtime validation."},"steps":["Identify the handling responsibility."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q07","number":7,"marks":1,"topic":"Remote tools","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 241–245","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K06"],"format":"mcq","difficulty":"Application","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"What does the MCP server provide for the framework to load?","statements":[],"options":{"A":"Tools together with their schemas","B":"Only a final response for every possible request","C":"A guarantee that every query remains local","D":"A replacement for the model’s task selection"},"answer":"A","explanation":"An MCP server publishes tools and their schemas, which the framework can offer alongside local tools.","option_analysis":{"A":"This matches the source description.","B":"Published tools still need to be selected and used.","C":"The source says remote-tool queries are sent to that server.","D":"The agent still decides when to call available tools."},"steps":["Identify what is published.","Separate tool availability from execution."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q08","number":8,"marks":1,"topic":"Service categories","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 278–289","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K07"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which pairing matches the source’s managed-service tool categories?","statements":[],"options":{"A":"Code Interpreter = knowledge; File Search = action","B":"Every tool belongs only to a thread","C":"Function Calling = knowledge; search = action","D":"File Search = knowledge; Code Interpreter = action"},"answer":"D","explanation":"File Search appears under knowledge tools; Code Interpreter appears under action tools.","option_analysis":{"A":"This reverses the listed categories.","B":"A thread keeps message history; it is not a category.","C":"This reverses the listed categories.","D":"Both entries match the source list."},"steps":["Read each source category."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q09","number":9,"marks":1,"topic":"State and capabilities","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 291–291","pages":[],"learning_objectives":["LO-T03"],"knowledge_points":["T-K07"],"format":"mcq","difficulty":"Foundation","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"Which statement correctly distinguishes a toolset from a thread?","statements":[],"options":{"A":"A thread groups tools; a toolset stores messages","B":"A toolset groups tools; a thread retains conversation history","C":"Both mean the final model answer","D":"Neither is used by the source’s service example"},"answer":"B","explanation":"The source says tools can be used together as a toolset and threads track the message history of a conversation.","option_analysis":{"A":"This reverses their roles.","B":"This matches the stated roles.","C":"Neither term means the final answer.","D":"Both are named in the example."},"steps":["Separate available capabilities from message history."],"exam_tip":"","pitfall":"","original":true},{"id":"T-Q10","number":10,"marks":1,"topic":"Original access scenario","subsection":"Microsoft AI Agents for Beginners, Tool Use, lines 329–333","pages":[],"learning_objectives":["LO-T04"],"knowledge_points":["T-K08"],"format":"mcq","difficulty":"Application","scenario_id":null,"scenario_title":null,"scenario":null,"stem":"An agent is intended to answer questions by reading a database. Which access arrangement follows the lesson’s recommendation?","statements":[],"options":{"A":"Give it permission to drop tables so every request succeeds","B":"Use unrestricted database administration access","C":"Assign restricted read-only access, such as a SELECT role","D":"Rely on the tool’s name instead of database permissions"},"answer":"C","explanation":"Original scenario: the lesson recommends read-only database configuration and a read-only SELECT role for the named database services.","option_analysis":{"A":"Dropping tables exceeds the source’s reading boundary.","B":"Unrestricted administration conflicts with the recommendation.","C":"This implements the stated restricted reading access.","D":"Naming is not the permission configuration described."},"steps":["Identify the intended reading task.","Apply the source’s restricted access recommendation."],"exam_tip":"","pitfall":"","original":true}],"modules":["mindmap","flashcards","quiz"],"examDurationMinutes":null,"downloadPrefix":"AgentToolUse"}]}</script><script>window.HubModules={};</script><script>
(function () {
  'use strict';

  window.HubModules.mindmap = { mount };

  function mount(api) {
    const container = api.container;
    const chapter = api.chapter;
    const chapterNumber = chapter.number ?? chapter.id;
    const NS = 'http://www.w3.org/2000/svg';
    const controller = new AbortController();
    const listen = (target, type, handler, options = {}) => target.addEventListener(type, handler, { ...options, signal: controller.signal });
    const S = (name, attrs = {}, value) => {
      const element = document.createElementNS(NS, name);
      for (const [key, item] of Object.entries(attrs)) element.setAttribute(key, String(item));
      if (value != null) element.textContent = String(value);
      return element;
    };
    const string = value => Array.isArray(value) ? value.join('; ') : value == null ? '' : String(value);
    const app = document.createElement('section');
    app.className = 'mm-app';
    // This markup is static. All chapter content is assigned through textContent.
    app.innerHTML = `
      <header class="mm-header">
        <p class="mm-eyebrow" id="mm-chapter-label"></p><h2 class="mm-title" id="mm-title"></h2>
        <div class="mm-tools">
          <div class="mm-search-group"><label for="mm-search" class="mm-sr-only">Search concepts</label><input id="mm-search" type="search" placeholder="Search concepts…" autocomplete="off"><button id="mm-search-previous" type="button" aria-label="Previous search match">‹</button><button id="mm-search-next" type="button" aria-label="Next search match">›</button></div>
          <div class="mm-tool-group"><button id="mm-expand-all" type="button">Expand all</button><button id="mm-collapse-all" type="button">Collapse all</button><button id="mm-fit-view" type="button">Fit</button><button id="mm-zoom-out" type="button" aria-label="Zoom out">−</button><span id="mm-zoom-level" class="mm-zoom-level">100%</span><button id="mm-zoom-in" type="button" aria-label="Zoom in">+</button></div>
          <details class="mm-export-menu" id="mm-export-menu"><summary>Export</summary><div class="mm-export-box"><label><input id="mm-export-all" type="checkbox"> Include the full tree</label><div class="mm-tool-group"><button id="mm-export-png" type="button">Download PNG</button><button id="mm-export-svg" type="button">Download SVG</button></div><p>Exports include the complete visible diagram, regardless of zoom or pan. Full tree also includes collapsed branches.</p></div></details>
        </div>
        <div class="mm-status-row"><span id="mm-status" role="status" aria-live="polite"></span><span id="mm-search-status" role="status" aria-live="polite"></span></div>
      </header>
      <div class="mm-workspace"><div class="mm-stage" id="mm-stage"><svg id="mm-svg" class="mm-map-svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Chapter mind map. Drag to pan; wheel or pinch to zoom." tabindex="0"><g id="mm-scene"></g></svg><div class="mm-hint-strip">Drag to pan · Single-click to expand · Double-click for details · Shift+Enter for details · F to fit</div></div>
      <aside id="mm-details" class="mm-details-panel" aria-labelledby="mm-detail-title" hidden><div class="mm-details-heading"><h3 id="mm-detail-title" tabindex="-1"></h3><button id="mm-close-details" type="button" aria-label="Close concept details">×</button></div><p id="mm-detail-summary" class="mm-detail-summary"></p><section id="mm-detail-explanation-wrap"><h4>Detailed explanation</h4><p id="mm-detail-explanation"></p></section><section id="mm-detail-exam-wrap"><h4>Exam focus</h4><p id="mm-detail-exam"></p></section><section class="mm-source"><h4>Source index</h4><p id="mm-detail-source"></p><a id="mm-detail-source-link" target="_blank" rel="noopener noreferrer" hidden>Open source</a></section></aside></div>`;
    container.append(app);
    const $ = id => app.querySelector('#mm-' + id);
    const svg = $('svg'), scene = $('scene'), stage = $('stage');
    $('title').textContent = chapter.title;
    $('chapter-label').textContent = `Chapter ${chapterNumber} · Knowledge map`;

    const nodes = new Map(), parents = new Map(), branches = new Map(), defaults = new Set();
    function index(node, parent = null, depth = 0, branch = -1) {
      if (!node || typeof node.id !== 'string' || !node.id || nodes.has(node.id)) throw Error('Every concept needs a unique text ID.');
      nodes.set(node.id, node); parents.set(node.id, parent); branches.set(node.id, branch);
      if (depth < 2) defaults.add(node.id);
      for (const [position, child] of (node.children || []).entries()) index(child, node.id, depth + 1, depth === 0 ? position : branch);
    }
    try { index(chapter.root); } catch (error) {
      $('status').textContent = error.message;
      api.notify(error.message);
      const errorState = { schema: 1, expandedIds: [], camera: { x: 0, y: 0, z: 1 }, selectedId: null, detailsOpen: false, search: { query: '', matchIndex: -1 }, exportAll: false };
      api.onChange(errorState);
      return { getState: () => structuredClone(errorState), getReport: () => null, destroy() { controller.abort(); app.remove(); } };
    }

    const saved = api.state && typeof api.state === 'object' ? api.state : {};
    const expanded = new Set(Array.isArray(saved.expandedIds) ? saved.expandedIds.filter(id => nodes.has(id)) : defaults);
    const hasSavedCamera = saved.camera && ['x', 'y', 'z'].every(key => Number.isFinite(saved.camera[key])) && saved.camera.z >= .02 && saved.camera.z <= 3.5;
    let camera = hasSavedCamera ? { x: saved.camera.x, y: saved.camera.y, z: saved.camera.z } : { x: 0, y: 0, z: 1 };
    let selected = nodes.has(saved.selectedId) ? saved.selectedId : null;
    let detailsOpen = !!saved.detailsOpen && !!selected;
    let query = typeof saved.search?.query === 'string' ? saved.search.query : '';
    let searchQuery = query.trim().toLocaleLowerCase(), matches = [], matchIndex = -1;
    let light = document.body.classList.contains('light'), model = null, destroyed = false, observer = null, initialFrame = null, lastSize = null;
    let needsInitialFit = !hasSavedCamera;
    const timers = new Set(), objectUrls = new Set(), pointers = new Map();
    const DOUBLE_TAP_MS = 280;
    let pendingTap = null;
    const measure = document.createElement('canvas').getContext('2d');
    const WIDTH = 286, GAP = 94, ROW = 22, PAD = 48;
    const palette = ['#81aef5', '#b49aef', '#71c6b1', '#e8b577', '#e394a8', '#8cc8df'];
    $('search').value = query;
    $('export-all').checked = !!saved.exportAll;

    function getState() {
      return { schema: 1, expandedIds: [...expanded], camera: { ...camera }, selectedId: selected, detailsOpen,
        search: { query, matchIndex }, exportAll: $('export-all').checked };
    }

      on(action('shuffle'), 'click', () => confirmAction('Shuffle this attempt?', 'Randomise card order and start at the first shuffled card? Existing self-assessments will be retained.', 'Shuffle', () => {
        for (let index = state.order.length - 1; index > 0; index--) {
          const random = Math.floor(Math.random() * (index + 1));
          [state.order[index], state.order[random]] = [state.order[random], state.order[index]];
        }
        state.currentId = null;
        resetFace();
        change('Cards shuffled; self-assessments retained.');
      }));
      on(action('restart'), 'click', () => confirmAction('Restart this attempt?', 'Clear current self-assessments and filters, return to original card order, and load the current library. Earlier records and library changes are retained.', 'Restart', async () => {
        if (typeof api.onRestart === 'function') await api.onRestart();
        if (!alive) return;
        state = freshState(state.subsetIds);
        libraryChanged = false;
        change('Restarted in original order using the current library.');
        focusCard();
      }));
      on(action('add'), 'click', () => openEditor(false));
      on(action('edit'), 'click', () => openEditor(true));
      on(action('hide'), 'click', hideCard);
      on(action('restore'), 'click', () => {
        if (!canEdit) return;
        confirmAction('Restore original library cards?', 'Remove edits to original cards and unhide them. Custom cards remain. This attempt and earlier records are unchanged.', 'Restore originals', async () => {
          const next = copy(library);
          next.overrides = {};
          next.hidden = next.hidden.filter(id => !originalMap.has(id));
          await saveLibrary(next);
          message('Original library cards restored. Restart or start a new session to use them.');
        });
      });
      on(action('export'), 'click', exportLibrary);
      on(action('import'), 'click', () => { $('.fc-manage').open = false; $('.fc-import-file').click(); });
      on($('.fc-import-file'), 'change', event => importLibrary(event.target.files[0]));
      on(action('editor-close'), 'click', closeEditor);
      on(action('editor-cancel'), 'click', closeEditor);
      on($('.fc-editor'), 'cancel', event => { event.preventDefault(); if (!pending) closeEditor(); });
      on($('.fc-editor-form'), 'submit', saveEditor);
      on($('.fc-explanation'), 'toggle', () => {
        if (!state.flipped || state.explanationOpen === $('.fc-explanation').open) return;
        state.explanationOpen = $('.fc-explanation').open;
        api.onChange(getState());
      });
      on($('.fc-card'), 'click', event => { if (!event.target.closest('button,details,a,input,textarea,select')) flip(); });
      on(root, 'keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || pending || completing || $('.fc-editor').open || event.target.closest('input,textarea,select,button,summary,a,[contenteditable="true"]')) return;
        if (event.key === ' ') { event.preventDefault(); flip(); }
        else if (event.key === 'ArrowLeft') { event.preventDefault(); move(-1); }
        else if (event.key === 'ArrowRight') { event.preventDefault(); move(1); }
        else if (event.key === '1') { event.preventDefault(); rate('review'); }
        else if (event.key === '2') { event.preventDefault(); rate('known'); }
        else if (event.key.toLowerCase() === 'h') { event.preventDefault(); hint(); }
      });
      render();
      api.onChange(getState());
      return {
        getState,
        getReport,
        destroy() {
          alive = false;
          for (const remove of listeners) remove();
          for (const url of urls) URL.revokeObjectURL(url);
          urls.clear();
          if ($('.fc-editor').open) $('.fc-editor').close();
          container.replaceChildren();
        }
      };
    }
  };
})();

</script>
<script>
(function () {
  'use strict';

  const LETTERS = ['A', 'B', 'C', 'D'];
  const copy = value => JSON.parse(JSON.stringify(value));
  const asText = value => value == null ? '' : String(value);
  const array = value => Array.isArray(value) ? value : [];

  function mount(api) {
    const container = api.container;
    const questions = array(api.chapter.questions);
    const examMinutes = Number(api.chapter.examDurationMinutes);
    const EXAM_MS = Number.isFinite(examMinutes) && examMinutes > 0 ? Math.round(examMinutes * 60 * 1000) : null;
    const examLabel = EXAM_MS ? timeText(EXAM_MS) : '';
    const byId = new Map(questions.map(question => [question.id, question]));
    const allIds = questions.map(question => question.id);
    let destroyed = false;
    let pending = false;
    let expiryRequested = false;
    let timer = null;
    let initialTick = null;
    const announced = new Set();

    function node(tag, text, className) {
      const element = document.createElement(tag);
      if (text != null) element.textContent = asText(text);
      if (className) element.className = className;
      return element;
    }

    function button(text, action, className) {
      const element = node('button', text, className || 'qz-button');
      element.type = 'button';
      element.dataset.action = action;
      return element;
    }

    function elapsed() {
      const value = Number(api.getElapsedMs());
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function uniqueValid(ids, allowed) {
      return [...new Set(array(ids).filter(id => typeof id === 'string' && allowed.has(id)))];
    }

    function normalise(saved) {
      const input = saved && typeof saved === 'object' ? saved : {};
      const subsetIds = uniqueValid(input.subsetIds, byId);
      const available = subsetIds.length ? subsetIds : allIds;
      const allowed = new Set(available);
      const order = uniqueValid(input.order, allowed);
      available.forEach(id => { if (!order.includes(id)) order.push(id); });
      const mode = EXAM_MS && !subsetIds.length && input.mode === 'exam' ? 'exam' : 'practice';
      const answers = {};
      const checked = {};
      const flags = {};
      order.forEach(id => {
        if (input.answers && LETTERS.includes(input.answers[id])) answers[id] = input.answers[id];
        if (mode === 'practice' && answers[id] && input.checked && input.checked[id] === true) checked[id] = true;
        if ((Array.isArray(input.flags) && input.flags.includes(id)) || (input.flags && input.flags[id] === true)) flags[id] = true;
      });
      const requestedId = input.currentId || input.currentID || input.currentQuestion;
      const currentId = order.includes(requestedId) ? requestedId : order[0] || null;
      const baseline = Number.isFinite(input.examBaselineMs) && input.examBaselineMs >= 0 ? input.examBaselineMs : elapsed();
      return {
        schema: 1,
        mode,
        subsetIds,
        order,
        currentId,
        answers,
        checked,
        flags,
        navFilter: ['all', 'unanswered', 'flagged'].includes(input.navFilter) ? input.navFilter : 'all',
        examBaselineMs: mode === 'exam' ? baseline : null,
        timeExpired: mode === 'exam' && (input.timeExpired === true || elapsed() >= baseline + EXAM_MS),
        submitted: input.submitted === true
      };
    }

    let state = normalise(api.state);

    function save() {
      if (!destroyed) api.onChange(copy(state));
    }

    function getState() {
      return copy(state);
    }

    function getReport() {
      const items = state.order.map(id => {
        const question = byId.get(id);
        const selected = state.answers[id] || null;
        const correct = selected === null ? null : selected === question.answer;
        return {
          itemId: id,
          topic: asText(question.topic),
          section: asText(question.subsection),
          pages: copy(array(question.pages)),
          question: asText(question.stem),
          scenario: question.scenario == null ? null : asText(question.scenario),
          scenarioTitle: question.scenario_title == null ? null : asText(question.scenario_title),
          statements: copy(array(question.statements)),
          options: Object.fromEntries(LETTERS.map(letter => [letter, asText(question.options[letter])])),
          selected,
          correct,
          correctAnswer: question.answer,
          explanation: asText(question.explanation),
          optionAnalysis: Object.fromEntries(LETTERS.map(letter => [letter, asText((question.option_analysis || {})[letter])])),
          steps: copy(array(question.steps)),
          examTip: asText(question.exam_tip),
          pitfall: asText(question.pitfall),
          marks: question.marks,
          earned: correct ? question.marks : 0
        };
      });
      const earned = items.reduce((sum, item) => sum + item.earned, 0);
      const max = items.reduce((sum, item) => sum + item.marks, 0);
      return {
        mode: state.mode,
        scoreLabel: `${earned} / ${max} marks`,
        earned,
        max,
        answered: items.filter(item => item.selected !== null).length,
        correct: items.filter(item => item.correct === true).length,
        total: items.length,
        items
      };
    }

    function source(question) {
      const pages = array(question.pages).join(', ');
      return `Chapter ${api.chapter.number || api.chapter.id}${question.subsection ? ' · Source section / locator ' + asText(question.subsection) : ''}${pages ? ' · Printed ' + (array(question.pages).length === 1 ? 'page ' : 'pages ') + pages : ''}`;
    }

    function timeText(ms) {
      const seconds = Math.max(0, Math.ceil(ms / 1000));
      return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function remainingMs() {
      return state.mode === 'exam' ? Math.max(0, state.examBaselineMs + EXAM_MS - elapsed()) : null;
    }

    function clockUpdate() {
      const clock = container.querySelector('#qz-clock');
      if (!clock) return;
      const remaining = remainingMs();
      clock.textContent = remaining === null ? 'Untimed practice' : `${timeText(remaining)} remaining`;
      clock.classList.toggle('qz-urgent', remaining !== null && remaining <= 300000);
    }

    function guard() {
      if (destroyed || pending || state.submitted || state.timeExpired) return false;
      if (state.mode === 'exam' && remainingMs() <= 0) {
        tick();
        return false;
      }
      return true;
    }

    function feedback(question) {
      const selected = state.answers[question.id];
      const correct = selected === question.answer;
      const section = node('section', null, 'qz-feedback');
      section.id = 'qz-feedback';
      section.setAttribute('aria-labelledby', 'qz-feedback-heading');
      const heading = node('h3', correct ? `Correct · ${question.marks}/${question.marks} marks` : `Incorrect · 0/${question.marks} marks`, correct ? 'qz-good-text' : 'qz-bad-text');
      heading.id = 'qz-feedback-heading';
      heading.tabIndex = -1;
      section.append(heading, node('p', `Your answer: ${selected}. Correct answer: ${question.answer}.`), node('p', question.explanation, 'qz-prose'));
      const analyses = node('ul', null, 'qz-analysis-list');
      LETTERS.forEach(letter => {
        const item = node('li');
        item.append(node('strong', `${letter} — ${letter === question.answer ? 'correct' : 'incorrect'}: `), node('span', (question.option_analysis || {})[letter]));
        analyses.append(item);
      });
      section.append(node('h4', 'Why each option is right or wrong'), analyses);
      function part(title, content, ordered) {
        if (!content || (Array.isArray(content) && !content.length)) return;
        section.append(node('h4', title));
        if (Array.isArray(content)) {
          const list = node(ordered ? 'ol' : 'ul', null, 'qz-detail-list');
          content.forEach(text => list.append(node('li', text)));
          section.append(list);
        } else section.append(node('p', content, 'qz-prose'));
      }
      part('Worked steps', question.steps, true);
      part('Common pitfall', question.pitfall);
      part('Exam technique', question.exam_tip);
      part('Knowledge points', question.knowledge_points);
      part('Learning objectives', question.learning_objectives);
      section.append(node('p', source(question), 'qz-source'));
      return section;
    }

    function render() {
      if (destroyed) return;
      const wrap = node('section', null, 'qz-module');
      wrap.id = 'qz-module';
      const answered = state.order.filter(id => state.answers[id]).length;
      const marked = state.order.filter(id => state.flags[id]).length;
      const maximum = state.order.reduce((sum, id) => sum + byId.get(id).marks, 0);
      const bar = node('div', null, 'qz-toolbar');
      const modeLabel = node('label', 'Mode ', 'qz-mode-label');
      const mode = node('select');
      mode.id = 'qz-mode';
      mode.dataset.action = 'qz-mode';
      mode.setAttribute('aria-label', 'Quiz mode');
      [['practice', 'Practice'], ...(EXAM_MS ? [['exam', 'Exam · ' + examLabel]] : [])].forEach(([value, title]) => {
        const option = node('option', title);
        option.value = value;
        option.selected = value === state.mode;
        option.disabled = value === 'exam' && state.subsetIds.length > 0;
        mode.append(option);
      });
      mode.disabled = pending || state.submitted || state.timeExpired || state.subsetIds.length > 0;
      modeLabel.append(mode);
      const clock = node('span', '', 'qz-clock');
      clock.id = 'qz-clock';
      clock.setAttribute('role', 'timer');
      clock.setAttribute('aria-live', 'off');
      const submitButton = button('Submit and record', 'qz-submit', 'qz-button qz-primary');
      submitButton.id = 'qz-submit';
      submitButton.disabled = pending || state.submitted;
      bar.append(modeLabel, clock, submitButton);
      wrap.append(bar);
      const intro = state.subsetIds.length ? `${state.order.length} questions · ${maximum} marks · Wrong-only practice · Untimed` : `${state.order.length} questions · ${maximum} marks`;
      wrap.append(node('p', intro, 'qz-summary'), node('p', state.mode === 'exam' ? 'Answers and explanations stay hidden until you submit. The clock uses active study time and resumes from your saved position.' : 'Choose an answer, then check it to see the teaching feedback. Checked answers are locked for this attempt.', 'qz-instructions'));
      const status = node('p', `${answered}/${state.order.length} answered · ${state.order.length - answered} unanswered · ${marked} flagged`, 'qz-progress-text');
      status.id = 'qz-progress-text';
      wrap.append(status);
      const progress = node('progress');
      progress.id = 'qz-progress';
      progress.max = state.order.length || 1;
      progress.value = answered;
      progress.setAttribute('aria-label', 'Questions answered');
      wrap.append(progress);
      if (state.timeExpired) wrap.append(node('p', 'Time has expired. Your saved answers are being recorded.', 'qz-expired'));
      if (state.submitted) wrap.append(node('p', 'Attempt submitted. Your results are available in the attempt history.', 'qz-completed'));

      const layout = node('div', null, 'qz-layout');
      const navigator = node('nav', null, 'qz-navigator');
      navigator.setAttribute('aria-label', 'Question navigator');
      navigator.append(node('h3', 'Questions'));
      const filterLabel = node('label', 'Show ', 'qz-filter-label');
      const filter = node('select');
      filter.id = 'qz-nav-filter';
      filter.dataset.action = 'qz-filter';
      [['all', 'All questions'], ['unanswered', 'Unanswered'], ['flagged', 'Flagged']].forEach(([value, title]) => {
        const option = node('option', title);
        option.value = value;
        option.selected = state.navFilter === value;
        filter.append(option);
      });
      filterLabel.append(filter);
      navigator.append(filterLabel);
      const grid = node('div', null, 'qz-grid');
      grid.id = 'qz-question-grid';
      const visible = state.order.filter(id => state.navFilter === 'all' || (state.navFilter === 'flagged' ? state.flags[id] : !state.answers[id]));
      visible.forEach(id => {
        const question = byId.get(id);
        const jump = button(null, 'qz-jump', 'qz-jump');
        jump.id = `qz-nav-${question.number}`;
        jump.dataset.questionId = id;
        jump.append(node('span', question.number), node('span', state.flags[id] ? 'F' : state.answers[id] ? '✓' : '·', 'qz-nav-status'));
        jump.classList.toggle('qz-answered', !!state.answers[id]);
        jump.classList.toggle('qz-flagged', !!state.flags[id]);
        if (state.currentId === id) jump.setAttribute('aria-current', 'step');
        jump.setAttribute('aria-label', `Question ${question.number}, ${state.answers[id] ? 'answered' : 'unanswered'}${state.flags[id] ? ', flagged' : ''}`);
        grid.append(jump);
      });
      navigator.append(grid);
      if (!visible.length) navigator.append(node('p', 'No questions match this filter.', 'qz-empty-filter'));
      navigator.append(node('p', '✓ Answered · F Flagged. The outline marks your current question.', 'qz-legend'));
      layout.append(navigator);

      const question = byId.get(state.currentId);
      const article = node('article', null, 'qz-question');
      article.id = 'qz-question';
      const position = state.order.indexOf(state.currentId);
      const heading = node('h2', `Question ${question.number}`);
      heading.id = 'qz-question-heading';
      heading.tabIndex = -1;
      article.setAttribute('aria-labelledby', heading.id);
      const headingRow = node('div', null, 'qz-heading-row');
      headingRow.append(heading, node('span', `${question.marks} ${question.marks === 1 ? 'mark' : 'marks'}`, 'qz-mark'));
      article.append(headingRow, node('p', `${position + 1} of ${state.order.length} in this attempt · ${question.difficulty || ''}`, 'qz-position'), node('p', question.topic, 'qz-topic'));
      if (question.scenario) {
        const scenario = node('section', null, 'qz-scenario');
        scenario.id = 'qz-scenario';
        scenario.append(node('h3', question.scenario_title || 'Shared scenario'), node('p', question.scenario, 'qz-prose'));
        article.append(scenario);
      }
      const stem = node('p', question.stem, 'qz-stem');
      stem.id = 'qz-stem';
      article.append(stem);
      if (array(question.statements).length) {
        const statements = node('ol', null, 'qz-statements');
        statements.id = 'qz-statements';
        statements.type = 'I';
        question.statements.forEach(statement => statements.append(node('li', statement)));
        article.append(statements);
      }
      const revealed = state.mode === 'practice' && state.checked[question.id] === true;
      const locked = pending || state.submitted || state.timeExpired || revealed;
      const fieldset = node('fieldset', null, 'qz-options');
      fieldset.id = 'qz-options';
      fieldset.disabled = locked;
      fieldset.append(node('legend', 'Choose one best answer'));
      LETTERS.forEach(letter => {
        const label = node('label', null, 'qz-option');
        const input = node('input');
        input.type = 'radio';
        input.name = 'qz-answer';
        input.id = `qz-option-${letter}`;
        input.value = letter;
        input.checked = state.answers[question.id] === letter;
        input.dataset.action = 'qz-answer';
        label.htmlFor = input.id;
        label.classList.toggle('qz-selected', input.checked);
        label.classList.toggle('qz-correct-option', revealed && letter === question.answer);
        label.classList.toggle('qz-wrong-option', revealed && input.checked && letter !== question.answer);
        const content = node('span', question.options[letter], 'qz-option-text');
        if (revealed && (letter === question.answer || input.checked)) content.append(node('span', letter === question.answer ? `Correct answer${input.checked ? ' · your choice' : ''}` : 'Your choice', 'qz-choice-tag'));
        label.append(input, node('strong', `${letter}.`, 'qz-letter'), content);
        fieldset.append(label);
      });
      article.append(fieldset);
      const actions = node('div', null, 'qz-actions');
      if (state.mode === 'practice') {
        const check = button('Check answer', 'qz-check', 'qz-button qz-primary');
        check.id = 'qz-check';
        check.disabled = locked || !state.answers[question.id];
        actions.append(check);
      }
      const clear = button('Clear answer', 'qz-clear');
      clear.id = 'qz-clear';
      clear.disabled = locked || !state.answers[question.id];
      const flag = button(state.flags[question.id] ? 'Remove flag' : 'Flag for review', 'qz-flag');
      flag.id = 'qz-flag';
      flag.setAttribute('aria-pressed', String(!!state.flags[question.id]));
      flag.disabled = pending || state.submitted || state.timeExpired;
      actions.append(clear, flag);
      article.append(actions);
      if (revealed) {
        article.append(node('p', 'This answer is checked and locked for this attempt.', 'qz-locked'), feedback(question));
      }
      article.append(node('p', source(question) + (question.original ? ' · Original practice question' : ''), 'qz-source'));
      const navigation = node('div', null, 'qz-navigation');
      const previous = button('Previous', 'qz-previous');
      previous.id = 'qz-previous';
      previous.disabled = position <= 0 || pending;
      const next = button('Next', 'qz-next');
      next.id = 'qz-next';
      next.disabled = position >= state.order.length - 1 || pending;
      navigation.append(previous, node('span', `${position + 1} / ${state.order.length}`, 'qz-navigation-position'), next);
      article.append(navigation);
      layout.append(article);
      wrap.append(layout);
      container.replaceChildren(wrap);
      clockUpdate();
    }

    function focus(selector) {
      const element = container.querySelector(selector);
      const reveal = selector === '#qz-question-heading' || selector === '#qz-feedback-heading';
      if (element) element.focus({ preventScroll: !reveal });
    }

    function navigate(id) {
      if (destroyed || pending || !state.order.includes(id)) return;
      if (state.mode === 'exam' && !state.submitted && remainingMs() <= 0) { tick(); return; }
      state.currentId = id;
      save();
      render();
      focus('#qz-question-heading');
    }

    async function submit(timedOut) {
      if (destroyed || state.submitted || (pending && !timedOut)) return;
      if (!timedOut && state.mode === 'exam' && remainingMs() <= 0) { tick(); return; }
      const unanswered = state.order.filter(id => !state.answers[id]).length;
      if (!timedOut && unanswered) {
        pending = true;
        render();
        let approved = false;
        try {
          approved = await api.confirm({ title: 'Submit with unanswered questions?', message: `${unanswered} ${unanswered === 1 ? 'question is' : 'questions are'} unanswered and will earn zero marks. Submit this attempt and record the results?`, confirmLabel: 'Submit and record' });
        } catch (_) {
          if (!destroyed) api.notify('The submission confirmation could not be opened. Please try again.');
        }
        if (destroyed || state.submitted) return;
        pending = false;
        if (!approved) { render(); focus('#qz-submit'); return; }
        if (state.mode === 'exam' && remainingMs() <= 0) { tick(); return; }
      }
      if (destroyed || state.submitted) return;
      pending = false;
      if (timedOut) state.timeExpired = true;
      state.submitted = true;
      save();
      render();
      if (timedOut) api.notify('Time expired. Your saved answers have been submitted automatically.');
      try {
        await api.onComplete(getReport());
      } catch (_) {
        if (!destroyed) {
          state.submitted = false;
          save();
          render();
          api.notify('The attempt could not be recorded. Your answers are retained; please submit again.');
        }
      }
    }

    function tick() {
      if (destroyed || state.submitted || state.mode !== 'exam') return;
      const remaining = remainingMs();
      clockUpdate();
      if (remaining <= 0 && !expiryRequested) {
        expiryRequested = true;
        state.timeExpired = true;
        save();
        void submit(true);
        return;
      }
      for (const threshold of [300000, 60000]) {
        if (remaining > 0 && remaining <= threshold && !announced.has(threshold)) {
          announced.add(threshold);
          api.notify(`${timeText(remaining)} remaining in this exam attempt.`);
        }
      }
    }

    async function switchMode(nextMode) {
      if (!guard() || state.subsetIds.length || !['practice', 'exam'].includes(nextMode) || nextMode === state.mode) { render(); return; }
      if (Object.keys(state.answers).length || Object.keys(state.flags).length) {
        pending = true;
        render();
        let approved = false;
        try {
          approved = await api.confirm({ title: 'Start a different mode?', message: 'Changing mode starts a new attempt and clears the answers, checks and flags in this draft. Existing history is unchanged.', confirmLabel: 'Change mode and restart' });
        } catch (_) {
          if (!destroyed) api.notify('The mode confirmation could not be opened. Please try again.');
        }
        if (destroyed || state.submitted) return;
        pending = false;
        if (!approved) { render(); focus('#qz-mode'); return; }
        if (state.mode === 'exam' && remainingMs() <= 0) { tick(); return; }
      }
      api.onRestart();
      state.mode = nextMode;
      state.answers = {};
      state.checked = {};
      state.flags = {};
      state.currentId = state.order[0];
      state.navFilter = 'all';
      state.examBaselineMs = nextMode === 'exam' ? elapsed() : null;
      state.timeExpired = false;
      expiryRequested = false;
      announced.clear();
      save();
      render();
      focus('#qz-question-heading');

      if (action === 'qz-submit') { void submit(state.timeExpired); return; }
      if (action === 'qz-jump') { navigate(target.dataset.questionId); return; }
      const position = state.order.indexOf(state.currentId);
      if (action === 'qz-previous') { if (position > 0) navigate(state.order[position - 1]); return; }
      if (action === 'qz-next') { if (position < state.order.length - 1) navigate(state.order[position + 1]); return; }
      if (!guard()) return;
      const id = state.currentId;
      if (action === 'qz-flag') {
        if (state.flags[id]) delete state.flags[id]; else state.flags[id] = true;
        save(); render(); focus('#qz-flag');
      } else if (action === 'qz-clear' && !state.checked[id]) {
        delete state.answers[id];
        save(); render(); focus('#qz-option-A');
      } else if (action === 'qz-check' && state.mode === 'practice' && state.answers[id] && !state.checked[id]) {
        state.checked[id] = true;
        save(); render(); focus('#qz-feedback-heading');
      }
    }

    function onChange(event) {
      const target = event.target;
      if (target.dataset.action === 'qz-mode') { void switchMode(target.value); return; }
      if (target.dataset.action === 'qz-filter') {
        state.navFilter = ['all', 'unanswered', 'flagged'].includes(target.value) ? target.value : 'all';
        save(); render(); focus('#qz-nav-filter');
        return;
      }
      if (target.dataset.action !== 'qz-answer') return;
      if (!guard() || state.checked[state.currentId] || !LETTERS.includes(target.value)) { render(); return; }
      state.answers[state.currentId] = target.value;
      save(); render(); focus(`#qz-option-${target.value}`);
    }

    const validData = questions.length > 0 && byId.size === questions.length && questions.every(question => typeof question.id === 'string' && LETTERS.includes(question.answer) && [1, 2].includes(question.marks) && question.options && LETTERS.every(letter => typeof question.options[letter] === 'string') && typeof question.stem === 'string');
    if (!validData) {
      container.replaceChildren(node('p', 'The chapter questions could not be loaded. Return to the study hub and reopen this chapter.', 'qz-error'));
      return { getState, getReport: () => null, destroy() { destroyed = true; } };
    }

    container.addEventListener('click', onClick);
    container.addEventListener('change', onChange);
    save();
    render();
    timer = window.setInterval(tick, 500);
    initialTick = window.setTimeout(tick, 0);
    return {
      getState,
      getReport,
      destroy() {
        destroyed = true;
        window.clearInterval(timer);
        window.clearTimeout(initialTick);
        container.removeEventListener('click', onClick);
        container.removeEventListener('change', onChange);
      }
    };
  }

  window.HubModules.quiz = { mount };
}());

  function parseHTML(html) {
    if (typeof html !== 'string' || !html.trim()) throw new Error('Choose a non-empty history HTML archive.');
    const tags = /<!--[\s\S]*?(?:-->|$)|<([A-Za-z][A-Za-z0-9:-]*)\b((?:[^'"<>]|"[^"]*"|'[^']*')*)>/g;
    let match;
    let markerCount = 0;
    let raw = null;
    while ((match = tags.exec(html))) {
      if (!match[1]) continue;
      const tag = match[1].toLowerCase();
      const attributes = [];
      const attributePattern = /([^\s=/>]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
      let attribute;
      while ((attribute = attributePattern.exec(match[2]))) attributes.push([attribute[1].toLowerCase(), attribute[2] ?? attribute[3] ?? attribute[4] ?? '']);
      const ids = attributes.filter(([name]) => name === 'id');
      const isMarker = ids.some(([, value]) => value === MARKER);
      if (isMarker) {
        markerCount++;
        if (markerCount > 1 || ids.length !== 1) throw new Error('The archive contains duplicate history markers.');
        const types = attributes.filter(([name]) => name === 'type');
        if (tag !== 'script' || types.length !== 1 || types[0][1].toLowerCase().trim() !== 'application/json') throw new Error('The history marker must contain application/json data.');
      }
      // Raw-text elements are skipped as text; no imported element is created or executed.
      if (['script', 'style', 'textarea', 'title', 'xmp', 'iframe', 'noembed', 'noframes'].includes(tag)) {
        const closing = new RegExp('</' + tag + '\\s*>', 'gi');
        closing.lastIndex = tags.lastIndex;
        const end = closing.exec(html);
        if (!end) {
          if (isMarker) throw new Error('The history data element is incomplete.');
          break;
        }
        if (isMarker) raw = html.slice(tags.lastIndex, end.index);
        tags.lastIndex = closing.lastIndex;
      }
    }
    if (markerCount !== 1 || raw === null) throw new Error('No Study Studio history data marker was found.');
    let payload;
    try { payload = JSON.parse(raw); } catch (_) { throw new Error('The history archive contains invalid JSON.'); }
    return validateEnvelope(payload);
  }

  window.HubArchive = { makeHTML, parseHTML };

 add(view,add(e('div','hub-panel'),e('h3','','Updating this study file'),e('p','muted','Keep the same HTML filename and local folder when replacing it with a newer edition. Export a backup first, then import it if the browser does not restore your data. Existing question IDs and chapter IDs are kept stable as new chapters are added.'),e('p','small','Private browsing, cleared website data, different browser profiles or a different local file path can separate or remove browser storage. Exporting a backup is the portable way to retain it.')));
 add(view,add(e('div','hub-panel'),e('h3','','Leaving an assessment'),e('p','muted','Exit session and the navigation buttons offer Save and exit, Discard progress, or Keep studying. Save and exit adds a history checkpoint after you answer an item. Discard removes only unfinished progress; earlier history remains. Closing or reloading the tab automatically saves progress.')));
 view.append(e('p','small',`Available content: ${DATA.chapters.length} chapters · ${DATA.contentVersion}. Flashcard scores are self-assessments.`));
}
$('hub-import-file').addEventListener('change',async event=>{const file=event.target.files[0];try{if(!file)return;if(file.size>15000000)throw Error('Choose a backup smaller than 15 MB.');const incoming=validateStore(JSON.parse(await file.text()));if(active)throw Error('Exit the current session before importing a backup.');if(!(await confirm({title:'Replace current study data?',message:`Import ${incoming.history.length} history records and ${Object.keys(incoming.drafts).length} saved sessions? Export your current data first if you want to retain it.`,confirmLabel:'Import and replace'})))return;store=incoming;storageOK=true;setTheme();persist();render({page:'data'});notify('Study data restored. Resume saved sessions from Home.');}catch(error){notify('Import was not applied: '+error.message);}finally{event.target.value='';}});
$('hub-import-history-file').addEventListener('change',async event=>{const file=event.target.files[0];try{
 if(!file)return;if(file.size>40000000)throw Error('Choose an HTML history archive smaller than 40 MB.');
 const payload=window.HubArchive.parseHTML(await file.text());const incoming=validateStore({...defaults(),moduleId:payload.moduleId,history:payload.history}).history;
 if(active)throw Error('Exit the current session before importing history.');
 const existing=new Map(store.history.map(r=>[r.id,r])),unique=new Map();let duplicates=0;
 for(const r of incoming){const previous=existing.get(r.id)||unique.get(r.id);if(previous){if(canonical(previous)!==canonical(r))throw Error('A record ID conflicts with a different history snapshot. No records were imported.');duplicates++;}else unique.set(r.id,r);}
 if(!unique.size){notify(`All ${duplicates} records are already present. Nothing changed.`);return;}
 if(store.history.length+unique.size>5000)throw Error('The merged archive would exceed 5,000 history snapshots.');
 if(!(await confirm({title:'Merge this HTML history?',message:`Add ${unique.size} history records and skip ${duplicates} duplicates? Your current answer progress, mind maps and card edits will be kept.`,confirmLabel:'Merge history'})))return;
 store.history=[...store.history,...unique.values()].sort((a,b)=>String(b.recordedAt).localeCompare(String(a.recordedAt)));persist();render({page:'data'});notify(`Imported ${unique.size} history records. ${duplicates} duplicates skipped.`);
 }catch(error){notify('History import was not applied: '+error.message);}finally{event.target.value='';}});
for(const name of ['home','history','mistakes','data'])$('nav-'+name).addEventListener('click',()=>navigate({page:name}));$('hub-brand').addEventListener('click',()=>navigate({page:'home'}));$('hub-theme').addEventListener('click',()=>{store.settings.light=!store.settings.light;setTheme();scheduleSave();});
document.addEventListener('visibilitychange',()=>{if(active){capture();active.tick=document.hidden?null:performance.now();persist();}});
window.addEventListener('pagehide',()=>{capture();persist();});
window.addEventListener('beforeunload',event=>{capture();const saved=persist();if(active?.draft&&!saved){event.preventDefault();event.returnValue='';}});
setInterval(()=>{if(active?.draft&&!document.hidden){capture();persist();}},3000);
setTheme();render({page:'home'});
})();
</script></body></html>
