name: Publish release
on:
  push:
    tags: ['v1.0.0']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release packages
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python3 scripts/check_repository.py
          python3 scripts/test_node_details.py
          for file in skills/study-studio-en/assets/study-hub/*.js; do
            node --check "$file"
          done
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            docs/downloads/study-studio-en.zip \
            docs/downloads/study-studio-zh.zip \
            docs/downloads/ai-agents-tool-use-example.zip \
            docs/downloads/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "$GITHUB_REF_NAME — Your personal study studio" \
            --notes-file .github/release-notes.md
