<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2382" viewBox="0 0 1600 2382"><rect width="1600" height="2382" fill="#103E3C"/>
<style>text{font-family:Arial,sans-serif}</style>
<text x="80" y="72" font-size="20" font-weight="700" fill="#86E4BF">CODEX STUDY STUDIO / KNOWLEDGE OVERVIEW</text>
<text x="80" y="145" font-size="49" font-weight="700" fill="#F5F1E8">AI Agents: Tool Use in Practice</text>
<text x="80" y="195" font-size="24" fill="#B7CCC4">Microsoft AI Agents · Tool Use</text>
<rect x="80.0" y="255" width="453.3333333333333" height="146" rx="15" fill="#1C4F4B"/>
<text x="102.0" y="292" font-size="16" font-weight="700" fill="#F4A57E">01</text>
<text x="102.0" y="330" font-size="24" font-weight="700" fill="#F5F1E8">Model</text>
<path d="M540.3333333333333 326h26m-9 -8 9 8-9 8" fill="none" stroke="#86E4BF" stroke-width="3"/>
<rect x="573.3333333333333" y="255" width="453.3333333333333" height="146" rx="15" fill="#1C4F4B"/>
<text x="595.3333333333333" y="292" font-size="16" font-weight="700" fill="#F4A57E">02</text>
<text x="595.3333333333333" y="330" font-size="24" font-weight="700" fill="#F5F1E8">Tool code</text>
<path d="M1033.6666666666665 326h26m-9 -8 9 8-9 8" fill="none" stroke="#86E4BF" stroke-width="3"/>
<rect x="1066.6666666666665" y="255" width="453.3333333333333" height="146" rx="15" fill="#1C4F4B"/>
<text x="1088.6666666666665" y="292" font-size="16" font-weight="700" fill="#F4A57E">03</text>
<text x="1088.6666666666665" y="330" font-size="24" font-weight="700" fill="#F5F1E8">Model response</text>
<rect x="80" y="470" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="507" font-size="16" fill="#F4A57E" font-weight="700">T-K01</text>
<text x="106" y="550" font-size="27" fill="#F5F1E8" font-weight="700">Executable capabilities</text>
<text x="106" y="602" font-size="21" fill="#B7CCC4">Tools are functions or API calls invoked in response to model-</text>
<text x="106" y="629" font-size="21" fill="#B7CCC4">generated calls.</text>
<text x="106" y="672" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 27–29</text>
<rect x="816" y="470" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="507" font-size="16" fill="#F4A57E" font-weight="700">T-K02</text>
<text x="842" y="550" font-size="27" fill="#F5F1E8" font-weight="700">Choose the use case</text>
<text x="842" y="602" font-size="21" fill="#B7CCC4">Information retrieval, code, workflows, support and content</text>
<text x="842" y="629" font-size="21" fill="#B7CCC4">tasks.</text>
<text x="842" y="672" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 31–39</text>
<rect x="80" y="731" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="768" font-size="16" fill="#F4A57E" font-weight="700">T-schema-exec / Six building blocks</text>
<text x="106" y="811" font-size="27" fill="#F5F1E8" font-weight="700">Describe + invoke</text>
<text x="106" y="863" font-size="21" fill="#B7CCC4">Schemas describe tools; execution logic governs invocation.</text>
<text x="106" y="933" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 45–47</text>
<rect x="816" y="731" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="768" font-size="16" fill="#F4A57E" font-weight="700">T-message-integrate / Six building blocks</text>
<text x="842" y="811" font-size="27" fill="#F5F1E8" font-weight="700">Connect</text>
<text x="842" y="863" font-size="21" fill="#B7CCC4">Message handling manages flow; integration connects the tools.</text>
<text x="842" y="933" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 49–51</text>
<rect x="80" y="992" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="1029" font-size="16" fill="#F4A57E" font-weight="700">T-validation-state / Six building blocks</text>
<text x="106" y="1072" font-size="27" fill="#F5F1E8" font-weight="700">Validate + retain</text>
<text x="106" y="1124" font-size="21" fill="#B7CCC4">Handle failures and parameters; preserve context and earlier</text>
<text x="106" y="1151" font-size="21" fill="#B7CCC4">interactions.</text>
<text x="106" y="1194" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 53–55</text>
<rect x="816" y="992" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="1029" font-size="16" fill="#F4A57E" font-weight="700">T-K04</text>
<text x="842" y="1072" font-size="27" fill="#F5F1E8" font-weight="700">Tool contract</text>
<text x="842" y="1124" font-size="21" fill="#B7CCC4">Name, purpose, required parameters and expected output; the</text>
<text x="842" y="1151" font-size="21" fill="#B7CCC4">time example requires location.</text>
<text x="842" y="1194" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 45–108</text>
<rect x="80" y="1253" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="1290" font-size="16" fill="#F4A57E" font-weight="700">T-call / Function-call loop</text>
<text x="106" y="1333" font-size="27" fill="#F5F1E8" font-weight="700">Select</text>
<text x="106" y="1385" font-size="21" fill="#B7CCC4">The model returns the selected function name and arguments.</text>
<text x="106" y="1455" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 61–87</text>
<rect x="816" y="1253" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="1290" font-size="16" fill="#F4A57E" font-weight="700">T-execute / Function-call loop</text>
<text x="842" y="1333" font-size="27" fill="#F5F1E8" font-weight="700">Execute</text>
<text x="842" y="1385" font-size="21" fill="#B7CCC4">The application invokes the function’s code.</text>
<text x="842" y="1455" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 138–173</text>
<rect x="80" y="1514" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="1551" font-size="16" fill="#F4A57E" font-weight="700">T-return / Function-call loop</text>
<text x="106" y="1594" font-size="27" fill="#F5F1E8" font-weight="700">Return</text>
<text x="106" y="1646" font-size="21" fill="#B7CCC4">Send the result with its matching call_id, then obtain the</text>
<text x="106" y="1673" font-size="21" fill="#B7CCC4">answer.</text>
<text x="106" y="1716" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 175–192</text>
<rect x="816" y="1514" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="1551" font-size="16" fill="#F4A57E" font-weight="700">T-local / Local + remote tools</text>
<text x="842" y="1594" font-size="27" fill="#F5F1E8" font-weight="700">Local function</text>
<text x="842" y="1646" font-size="21" fill="#B7CCC4">A decorated function can be serialised to a schema.</text>
<text x="842" y="1716" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 208–216</text>
<rect x="80" y="1775" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="1812" font-size="16" fill="#F4A57E" font-weight="700">T-mcp / Local + remote tools</text>
<text x="106" y="1855" font-size="27" fill="#F5F1E8" font-weight="700">MCP server</text>
<text x="106" y="1907" font-size="21" fill="#B7CCC4">Publishes tools and schemas; remote queries go to the server.</text>
<text x="106" y="1977" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 241–245</text>
<rect x="816" y="1775" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="842" y="1812" font-size="16" fill="#F4A57E" font-weight="700">T-K07</text>
<text x="842" y="1855" font-size="27" fill="#F5F1E8" font-weight="700">Managed service</text>
<text x="842" y="1907" font-size="21" fill="#B7CCC4">The source groups knowledge and action tools; toolsets group</text>
<text x="842" y="1934" font-size="21" fill="#B7CCC4">capabilities and threads retain messages.</text>
<text x="842" y="1977" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 268–291</text>
<rect x="80" y="2036" width="704" height="237" rx="18" fill="#1C4F4B"/>
<text x="106" y="2073" font-size="16" fill="#F4A57E" font-weight="700">T-K08</text>
<text x="106" y="2116" font-size="27" fill="#F5F1E8" font-weight="700">Read-only boundary</text>
<text x="106" y="2168" font-size="21" fill="#B7CCC4">Restrict generated-SQL database access and use a secure</text>
<text x="106" y="2195" font-size="21" fill="#B7CCC4">environment.</text>
<text x="106" y="2238" font-size="13" fill="#86E4BF">Microsoft AI Agents for Beginners, Tool Use, lines 329–333</text>
